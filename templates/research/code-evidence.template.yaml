schema_version: 1
kind: code-evidence
feature: "<feature-slug>"
repository:
  id: "<repository-id>"
  commit: "<full-commit-sha>"
  branch: "<branch-or-detached>"
  inspected_at: "<ISO-8601>"
  worktree_state: clean
scope:
  contour: "<registered-contour>"
  question: "<Что требовалось установить>"
findings:
  - id: "CODE-<FEATURE>-001"
    classification: "<fact|inference|assumption|open-question>"
    observation: "<Краткое наблюдение без копирования исходного кода>"
    evidence:
      - path: "<relative/path/in/code-repository>"
        symbol: "<symbol-or-section>"
        note: "<Что именно подтверждает источник>"
    related_requirements: []
    disposition: "<transferred|open-question|reference-only>"
    transferred_to: []
